                        "service.scale", "service.update", "container.inspect", "container.wait", "container.ls",
                        "task.inspect", "network.inspect", "node.inspect", "stack.deploy", "info", "other",
                        "run.capability", "run.status", "run.begin", "run.attest", "run.migrate", "container.events"}
          checkpoint = Path("last-docker-operation")
          operation = checkpoint.read_text().strip() if checkpoint.is_file() else "unknown"
          if operation not in operations:
              operation = "unknown"
          print(json.dumps({"stage": "first_adoption", "exit_code": int(sys.argv[1]), "reason": reason,
                            "last_operation": operation,
                            "before_ddl": Path("before-ddl").is_file(),
                            "ddl_committed": Path("ddl-committed-launcher-failed").is_file()}))
          PY
          test -s before-ddl
          test -e ddl-committed-launcher-failed
          cat before-ddl
          test "$(psql_compat 'select version_num from alembic_version')" = 0020_draft_test_commands
          test "$(psql_compat "select minimum_contract || ':' || phase from deployment_contract where id=1")" = 3:blocked
          for role in api worker; do
            bootstrap_role="$role"
            test "$(docker service inspect --format '{{.Spec.Mode.Replicated.Replicas}}' "${compat}_$role")" = 0
            test "$(docker service inspect --format '{{.PreviousSpec.Mode.Replicated.Replicas}}' "${compat}_$role")" = 0
          done
          bootstrap_role=none
          candidate=$(docker image inspect --format '{{.Id}}' gerador-planos:ci)
          probe "$candidate" blocked
          versions() { docker service inspect --format '{{.ID}} {{.Version.Index}}' "${compat}_api" "${compat}_worker"; }
          before=$(versions)
          contract_before=$(psql_compat "select md5(row_to_json(d)::text) from deployment_contract d where id=1")
          : > "$folder/operation-trace"
          if env -u DOMAIN -u STACK PATH="$folder/bin:$PATH" IMAGE="$old_image" ./deploy.sh > refuse-old.log 2>&1; then
            echo 'Imagem antiga não pode voltar após0019'; exit 1
          fi
          test "$(versions)" = "$before"
          test "$(psql_compat "select minimum_contract || ':' || phase from deployment_contract where id=1")" = 3:blocked
          # O rollback explícito também recusa a baseline antes de tag, begin, DDL ou serviço.
          if env -u DOMAIN -u STACK PATH="$folder/bin:$PATH" ROLLBACK=1 IMAGE="$old_image" ./deploy.sh > refuse-old-rollback.log 2>&1; then exit 1; fi
          test "$(versions)" = "$before"
          test "$(psql_compat "select md5(row_to_json(d)::text) from deployment_contract d where id=1")" = "$contract_before"
          python3 - "$folder/operation-trace" <<'PYNOMUTATE'
          import sys
          from pathlib import Path
          allowed = {"image.inspect", "run.capability", "info", "network.inspect", "run.status",
                     "service.inspect", "service.ls", "service.ps", "container.inspect", "node.inspect"}
          observed = Path(sys.argv[1]).read_text().splitlines()
          if not observed or any(operation not in allowed for operation in observed):
              raise SystemExit(1)
          PYNOMUTATE
          if [ "$old_contract" = 2 ]; then
            # Exercita os entrypoints reais do binário2 contra o piso3, sem trocar serviços.
            docker run --rm -i --network "${compat}_internal" --env-file app.env \
              "$old_identity" python -I - <<'PYREFUSE'
          def verify_refusal():
              from fastapi.testclient import TestClient
              from app.api.main import create_app
              from app.deployment_contract import DeploymentContractError
              from app.worker import ready_deps

              def start_api():
                  with TestClient(create_app()):
                      pass

              for start in (start_api, ready_deps):
                  try:
                      start()
                  except DeploymentContractError:
                      continue
                  raise ValueError

          try:
              verify_refusal()
          except Exception:
              print('{"stage":"contract_two_runtime","result":"failed"}')
              raise SystemExit(1) from None
          print('{"stage":"contract_two_runtime","result":"refused","checks":2}')
          PYREFUSE
            test "$(versions)" = "$before"
            test "$(psql_compat "select md5(row_to_json(d)::text) from deployment_contract d where id=1")" = "$contract_before"
          fi
          env -u DOMAIN -u STACK IMAGE=gerador-planos:ci ./deploy.sh
          test "$(psql_compat "select minimum_contract || ':' || phase from deployment_contract where id=1")" = 3:verified
          candidate=$(docker image inspect --format '{{.Id}}' gerador-planos:ci)
          for role in api worker; do
            bootstrap_role="$role"
            current=$(docker service inspect --format '{{.Spec.TaskTemplate.ContainerSpec.Image}}' "${compat}_$role")
            previous=$(docker service inspect --format '{{.PreviousSpec.TaskTemplate.ContainerSpec.Image}}' "${compat}_$role")
            test "$(docker image inspect --format '{{.Id}}' "$current")" = "$candidate"
            test "$(docker image inspect --format '{{.Id}}' "$previous")" = "$candidate"
            test "$(docker service inspect --format '{{.Spec.Mode.Replicated.Replicas}}' "${compat}_$role")" = 1
            test "$(docker service inspect --format '{{.PreviousSpec.Mode.Replicated.Replicas}}' "${compat}_$role")" = 1
          done
          bootstrap_role=none
          while read -r container; do
            "$folder/bin/docker" ci-prove-stopped "$container"
          done < old-containers
          probe "$candidate" create
          # Imagem distinta de mesmo código3: atualização3→3 e rollback3→3 reais.
          docker build --quiet --tag leadkit:compat-return - <<'DOCKERFILE'
          FROM gerador-planos:ci
          LABEL ci.continuation-return="compatible-three"
          DOCKERFILE
          return_identity=$(docker image inspect --format '{{.Id}}' leadkit:compat-return)
          test "$return_identity" != "$candidate"
          before=$(versions)
          env -u DOMAIN -u STACK IMAGE=leadkit:compat-return ./deploy.sh
          test "$(versions)" != "$before"
          for role in api worker; do
            current=$(docker service inspect --format '{{.Spec.TaskTemplate.ContainerSpec.Image}}' "${compat}_$role")
            previous=$(docker service inspect --format '{{.PreviousSpec.TaskTemplate.ContainerSpec.Image}}' "${compat}_$role")
            test "$(docker image inspect --format '{{.Id}}' "$current")" = "$return_identity"
            test "$(docker image inspect --format '{{.Id}}' "$previous")" = "$candidate"
          done
          before=$(versions)
          env -u DOMAIN -u STACK ROLLBACK=1 IMAGE="$candidate" ./deploy.sh
          test "$(versions)" != "$before"
          test "$(psql_compat "select minimum_contract || ':' || phase from deployment_contract where id=1")" = 3:verified
          for role in api worker; do
            for spec in Spec PreviousSpec; do
              reference=$(docker service inspect --format "{{.$spec.TaskTemplate.ContainerSpec.Image}}" "${compat}_$role")
              identity=$(docker image inspect --format '{{.Id}}' "$reference")
              if [ "$spec" = Spec ]; then
                test "$identity" = "$candidate"
              else
                test "$identity" = "$return_identity"
              fi
              docker run --rm --network none "$identity" python -m app.deployment_contract capability | python3 -c 'import json,sys; assert json.load(sys.stdin) == {"contract":3}'
              probe "$identity" return
            done
          done
          echo 'Bootstrap real: saída antesDDL, falha apósDDL, recusa de retorno antigo e recuperação3 comprovadas'

      - name: Check that two stack names never share a Traefik name
        run: |
          # O que o Swarm recebe do stack.yaml com STACK=stack-a e com STACK=stack-b: os dois routers,
          # o serviço e os três middlewares de cada uma, sem nenhum nome em comum. Sem STACK (ou
          # vazio), o fallback técnico do YAML continua gerador-planos. O exemplo distribuído
          # escolhe leadkit explicitamente e é conferido à parte. Só nomes saem no log.
          export LC_ALL=C
          cd "$CONF"
          config() { env -u STACK "$@" IMAGE=gerador-planos:ci DOMAIN="$DOMAIN" docker stack config -c stack.yaml; }
          names() { config "$@" | grep -o 'traefik\.http\.[a-z]*\.[A-Za-z0-9_-]*' | sort -u; }
          names STACK=stack-a > "$RUNNER_TEMP/names-a"
          names STACK=stack-b > "$RUNNER_TEMP/names-b"
          names STACK= > "$RUNNER_TEMP/names-empty"
          names > "$RUNNER_TEMP/names-unset"
          echo "stack-a:"; cat "$RUNNER_TEMP/names-a"
          echo "stack-b:"; cat "$RUNNER_TEMP/names-b"
          test "$(wc -l < "$RUNNER_TEMP/names-a")" -eq 6
          test "$(wc -l < "$RUNNER_TEMP/names-b")" -eq 6
          common=$(comm -12 "$RUNNER_TEMP/names-a" "$RUNNER_TEMP/names-b")
          if [ -n "$common" ]; then
            echo "as duas stacks repetem nomes do Traefik:"
            echo "$common"
            exit 1
          fi
          # Os middlewares que os routers chamam são os da própria stack.
          config STACK=stack-a | grep -qF 'stack-a-hsts,stack-a-compress'
          config STACK=stack-a | grep -qF 'stack-a-ratelimit,stack-a-hsts,stack-a-compress'
          # Ausente e vazio acionam o fallback do YAML, sem herdar STACK do runner.
          names STACK=gerador-planos > "$RUNNER_TEMP/names-default"
          diff "$RUNNER_TEMP/names-default" "$RUNNER_TEMP/names-empty"
          diff "$RUNNER_TEMP/names-default" "$RUNNER_TEMP/names-unset"
          # O exemplo é uma configuração explícita diferente, não o default do YAML.
          template_stack=$(sed -n 's/^STACK_NAME=//p' "$GITHUB_WORKSPACE/deploy/swarm/app.env.example")
          test -n "$template_stack"
          names STACK="$template_stack" > "$RUNNER_TEMP/names-template"
          test "$(wc -l < "$RUNNER_TEMP/names-template")" -eq 6
          for name in "routers.$template_stack" "routers.${template_stack}_submit" \
                      "services.$template_stack" "middlewares.${template_stack}-hsts" \
                      "middlewares.${template_stack}-compress" "middlewares.${template_stack}-ratelimit"; do
            grep -qxF "traefik.http.$name" "$RUNNER_TEMP/names-template"
          done
          echo "fallback técnico e exemplo explícito conferidos separadamente"

      - name: First deploy by hand, with the guide's commands
        run: |
          # Como a stack do servidor de produção subiu: o `docker stack deploy` e as migrations.
          cd "$CONF"
          FORWARDED_ALLOW_IPS=$(docker network inspect traefik-public --format '{{range $i, $c := .IPAM.Config}}{{if $i}},{{end}}{{$c.Subnet}}{{end}}')
          echo "FORWARDED_ALLOW_IPS=$FORWARDED_ALLOW_IPS"
          test -n "$FORWARDED_ALLOW_IPS"
          IMAGE=gerador-planos:ci STACK="$CI_STACK_NAME" FORWARDED_ALLOW_IPS="$FORWARDED_ALLOW_IPS" \
            docker stack deploy --detach=false --resolve-image changed -c stack.yaml gerador-planos
          docker run --rm --network gerador-planos_internal --env-file app.env gerador-planos:ci migrate
          docker stack ps gerador-planos
          for service in db api worker; do
            name="gerador-planos_$service"
            ports=$(docker service inspect --format '{{json .Endpoint.Ports}}' "$name")
            case "$ports" in null|"[]") ;; *) echo "$name publica portas: $ports"; exit 1 ;; esac
            container=$(docker ps -q -f "label=com.docker.swarm.service.name=$name" | head -n 1)
            health=$(docker inspect --format '{{.State.Health.Status}}' "$container")
            echo "$name: $health, sem portas publicadas"
            test "$health" = healthy
          done

      - name: Import the neutral demo explicitly in the first Swarm database
        run: |
          docker run --rm -i --network gerador-planos_internal --env-file "$CONF/app.env" gerador-planos:ci python -c 'from app.deps import get_deps; from app.forms.stored import import_definition; import sys; import_definition(get_deps(), sys.stdin.buffer.read(), actor="ci")' < examples/demo.json

      - name: Check the API through Traefik
        run: |
          # O Traefik lê os serviços do Swarm a cada 15 s.
          for _ in $(seq 1 30); do
            [ "$($CURL -o /dev/null -w '%{http_code}' "https://$DOMAIN/readyz")" = 200 ] && break
            sleep 2
          done
          $CURL --fail "https://$DOMAIN/readyz"
          echo
          # http vai para https no Traefik, como no servidor.
          redirect=$($CURL -o /dev/null -w '%{http_code} %{redirect_url}' "http://$DOMAIN/readyz")
          echo "http: $redirect"
          case "$redirect" in "30"[1278]" https://$DOMAIN/readyz") ;; *) exit 1 ;; esac
          # A API confia no X-Forwarded-Proto do Traefik: o redirect absoluto dela sai em https.
          location=$($CURL -o /dev/null -D - "https://$DOMAIN/healthz/" | tr -d '\r' | sed -n 's/^[Ll]ocation: //p')
          echo "redirect da API: $location"
          test "$location" = "https://$DOMAIN/healthz"
          # Os middlewares gerador-planos-hsts e gerador-planos-compress.
          $CURL -o /dev/null -D - "https://$DOMAIN/readyz" | tr -d '\r' \
            | grep -i '^strict-transport-security: max-age=31536000$'
          $CURL -o /dev/null -D - -H 'Accept-Encoding: gzip' "https://$DOMAIN/static/css/public.css" \
            | tr -d '\r' | grep -i '^content-encoding: gzip$'
          $CURL --fail -o /dev/null "https://$DOMAIN/p/demo"

      - name: Log in to the admin through Traefik
        run: |
          # O hash do admin chegou inteiro (com os `$`), a origem https bate e o cookie sai Secure.
          jar="$RUNNER_TEMP/cookies"
          headers=$($CURL -o /dev/null -D - -c "$jar" -H "Origin: https://$DOMAIN" \
            --data-urlencode username=ci-admin --data-urlencode "password@$RUNNER_TEMP/admin-password" \
            "https://$DOMAIN/admin/login" | tr -d '\r')
          echo "$headers" | grep -qi '^location: /admin/forms$'
          echo "$headers" | grep -i '^set-cookie: mcc_admin=' | grep -i 'httponly' | grep -qi 'secure'
          test "$($CURL -o /dev/null -w '%{http_code}' -b "$jar" "https://$DOMAIN/admin/forms")" = 200
          test "$($CURL -o /dev/null -w '%{http_code}' -b "$jar" "https://$DOMAIN/admin")" = 200
          echo "login no admin: ok"

      - name: Check the router in the Traefik API
        run: |
          # Os nomes que o servidor usa: router e serviço gerador-planos, middlewares
          # gerador-planos-hsts e gerador-planos-compress.
          curl -fsS "http://127.0.0.1:9000/api/http/routers/gerador-planos@docker" > "$RUNNER_TEMP/router.json"
          curl -fsS "http://127.0.0.1:9000/api/http/services/gerador-planos@docker" > "$RUNNER_TEMP/service.json"
          vips=$(docker service inspect --format '{{range .Endpoint.VirtualIPs}}{{.Addr}} {{end}}' gerador-planos_api)
          VIPS="$vips" python3 - "$RUNNER_TEMP/router.json" "$RUNNER_TEMP/service.json" <<'PY'
          import json
          import os
          import sys
          from urllib.parse import urlsplit

          router = json.load(open(sys.argv[1]))
          service = json.load(open(sys.argv[2]))
          print(json.dumps(router, indent=2))
          print(json.dumps(service, indent=2))
          assert router["status"] == "enabled", router
          assert router["rule"] == "Host(`%s`)" % os.environ["DOMAIN"], router["rule"]
          assert router["entryPoints"] == ["websecure"], router["entryPoints"]
          assert router["tls"]["certResolver"] == "letsencrypt", router["tls"]
          middlewares = [name.split("@")[0] for name in router["middlewares"]]
          assert middlewares == ["gerador-planos-hsts", "gerador-planos-compress"], middlewares
          # lbswarm: o Traefik fala com o IP virtual do serviço, não com os contêineres.
          servers = [urlsplit(s["url"]) for s in service["loadBalancer"]["servers"]]
          vips = {vip.split("/")[0] for vip in os.environ["VIPS"].split()}
          assert [s.port for s in servers] == [8000], servers
          assert servers[0].hostname in vips, (servers, vips)
          PY

      - name: Check the submit router and its rate limit in the Traefik API
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.request


          def get(path):
              with urllib.request.urlopen("http://127.0.0.1:9000/api/http/" + path, timeout=10) as response:
                  return json.load(response)


          domain = os.environ["DOMAIN"]
          main = get("routers/gerador-planos@docker")
          submit = get("routers/gerador-planos_submit@docker")
          limit = get("middlewares/gerador-planos-ratelimit@docker")
          print(json.dumps(submit, indent=2))
          print(json.dumps(limit, indent=2))
          assert submit["status"] == "enabled", submit
          assert submit["rule"] == (
              f"Host(`{domain}`) && Method(`POST`) && (PathPrefix(`/p/`) || PathPrefix(`/v1/forms/`))"
          ), submit["rule"]
          assert submit["entryPoints"] == ["websecure"], submit["entryPoints"]
          assert submit["tls"]["certResolver"] == "letsencrypt", submit["tls"]
          assert submit["service"].split("@")[0] == "gerador-planos", submit["service"]
          names = [name.split("@")[0] for name in submit["middlewares"]]
          assert names == ["gerador-planos-ratelimit", "gerador-planos-hsts", "gerador-planos-compress"], names
          # Acima do router principal. Sem prioridade fixa, a dele é o tamanho da regra (a API não a
          # mostra).
          assert "priority" not in main, main
          assert submit["priority"] > len(main["rule"]), (submit["priority"], main["rule"])
          assert limit["status"] == "enabled", limit
          rate = limit["rateLimit"]
          assert (rate["average"], rate["burst"]) == (10, 20), rate
          # Pelo IP da conexão, não por cabeçalho: o X-Forwarded-For é do cliente.
          criterion = rate.get("sourceCriterion", {})
          assert not criterion.get("requestHeaderName") and not criterion.get("requestHost"), criterion
          assert "ipStrategy" in criterion and criterion["ipStrategy"].get("depth", 0) == 0, criterion
          PY

      - name: Rate-limit the form POSTs per IP, and only them
        run: |
          # O corpo `{}` é inválido de propósito: a API responde 422 e nada é gravado. O app só
          # responde 429 por e-mail repetido ou fila cheia, e este corpo não chega a isso: todo 429
          # daqui é do Traefik. O limite padrão é 10 por minuto, com rajada de 20.
          post() {
            $CURL -o /dev/null -w '%{http_code}\n' -X POST -H 'Content-Type: application/json' \
              --data '{}' "https://$DOMAIN$1"
          }
          # O router dos envios roda o mesmo HSTS do principal.
          headers=$($CURL -o /dev/null -D - -X POST -H 'Content-Type: application/json' --data '{}' \
            "https://$DOMAIN/v1/forms/demo/submissions" | tr -d '\r')
          echo "$headers" | head -n 1 | grep -q ' 422'
          echo "$headers" | grep -i '^strict-transport-security: max-age=31536000$'

          # 40 envios seguidos: a rajada passa (422 da API) e o resto é barrado (429), nada mais.
          : > "$RUNNER_TEMP/posts"
          for _ in $(seq 40); do post /v1/forms/demo/submissions >> "$RUNNER_TEMP/posts"; done
          sort "$RUNNER_TEMP/posts" | uniq -c
          test "$(grep -c '^422$' "$RUNNER_TEMP/posts")" -ge 15
          test "$(grep -c '^429$' "$RUNNER_TEMP/posts")" -ge 5
          test "$(grep -cv -e '^422$' -e '^429$' "$RUNNER_TEMP/posts")" -eq 0

          # Os dois caminhos dividem o mesmo limite: com o IP sem crédito, o POST da página também cai.
          page=$(for _ in 1 2 3 4 5; do post /p/demo; done)
          echo "POST /p/demo: $(echo $page)"
          test "$(echo "$page" | grep -c '^429$')" -ge 1

          # Só o POST dos envios é limitado: o GET da página, e um POST fora dos dois caminhos, não.
          gets=$(for _ in $(seq 40); do $CURL -o /dev/null -w '%{http_code}\n' "https://$DOMAIN/p/demo"; done)
          echo "GET /p/demo: $(echo "$gets" | sort | uniq -c | tr -s ' ')"
          test "$(echo "$gets" | grep -c '^200$')" -eq 40
          others=$(for _ in $(seq 40); do post /readyz; done)
          echo "POST /readyz: $(echo "$others" | sort | uniq -c | tr -s ' ')"
          test "$(echo "$others" | grep -c '^405$')" -eq 40

      - name: Check the memory limits of the three services
        run: |
          # Os padrões do stack.yaml chegam ao serviço (teto e reserva, em bytes) e ao cgroup do
          # contêiner, que é o que de fato encerra um processo que passa do teto.
          mb=$((1024 * 1024))
          check() {
            sizes=$(docker service inspect --format '{{.Spec.TaskTemplate.Resources.Limits.MemoryBytes}} {{.Spec.TaskTemplate.Resources.Reservations.MemoryBytes}}' "gerador-planos_$1")
            echo "$1: teto e reserva em bytes: $sizes"
            test "$sizes" = "$(($2 * mb)) $(($3 * mb))"
            container=$(docker ps -q -f "label=com.docker.swarm.service.name=gerador-planos_$1" | head -n 1)
            test "$(docker inspect --format '{{.HostConfig.Memory}}' "$container")" = "$(($2 * mb))"
          }
          check api 512 128
          check worker 1536 512
          check db 1024 256

      - name: Keep the real client IP behind Traefik, and ignore a forged one from another network
        run: |
          # O deploy.sh e o comando à mão passam a sub-rede da traefik-public como FORWARDED_ALLOW_IPS.
          # O IP que o bloqueio de login usa aparece no log do app (`login recusado ip=...`).
          subnet=$(docker network inspect traefik-public --format '{{(index .IPAM.Config 0).Subnet}}')
          internal=$(docker network inspect gerador-planos_internal --format '{{(index .IPAM.Config 0).Subnet}}')
          env_value=$(docker service inspect --format '{{json .Spec.TaskTemplate.ContainerSpec.Env}}' gerador-planos_api)
          echo "traefik-public: $subnet; interna: $internal"
          echo "$env_value" | grep -qF "FORWARDED_ALLOW_IPS=$subnet"
          api() { docker ps -q -f label=com.docker.swarm.service.name=gerador-planos_api | head -n 1; }
          last_ip() {
            docker logs "$(api)" 2>&1 | grep 'login recusado' | tail -n 1 | sed -n 's/.*ip=\([^ ]*\).*/\1/p'
          }
          wait_for_log() {
            for _ in $(seq 1 15); do
              [ "$(docker logs "$(api)" 2>&1 | grep -c 'login recusado')" -gt "$1" ] && return 0
              sleep 1
            done
            echo "o log do app não mostrou o login recusado"
            return 1
          }
          count() { docker logs "$(api)" 2>&1 | grep -c 'login recusado' || true; }
          # Uma senha que não é a do admin, sorteada a cada execução.
          export WRONG_LOGIN=$(python3 -c 'import secrets; print(secrets.token_hex(8))')

          # 1. Pelo Traefik: o IP é o da conexão do runner, não o do Traefik na traefik-public. Se a API
          # não confiasse no cabeçalho, ela veria o IP do Traefik, e todo mundo contaria como um só.
          before=$(count)
          $CURL -o /dev/null -H "Origin: https://$DOMAIN" \
            --data-urlencode username=ci-admin --data-urlencode "password=$WRONG_LOGIN" "https://$DOMAIN/admin/login"
          wait_for_log "$before"
          real=$(last_ip)
          echo "pelo Traefik, o bloqueio viu: $real"
          SUBNET="$subnet" REAL="$real" python3 -c '
          import ipaddress, os
          ip = ipaddress.ip_address(os.environ["REAL"])
          assert ip not in ipaddress.ip_network(os.environ["SUBNET"]), "a API viu o IP do Traefik"
          '

          # 2. De outra rede (a interna), um X-Forwarded-For forjado é ignorado: o IP é o do contêiner
          # que falou, não o 203.0.113.77 que ele escreveu. Com FORWARDED_ALLOW_IPS=*, seria o forjado.
          before=$(count)
          docker run --rm -i --network gerador-planos_internal --env DOMAIN --env WRONG_LOGIN gerador-planos:ci python - <<'PY'
          import os
          import urllib.error
          import urllib.parse
          import urllib.request

          request = urllib.request.Request(
              "http://gerador-planos_api:8000/admin/login",
              data=urllib.parse.urlencode(
                  {"username": "ci-admin", "password": os.environ["WRONG_LOGIN"]}
              ).encode(),
              headers={"Origin": f"https://{os.environ['DOMAIN']}", "X-Forwarded-For": "203.0.113.77"},
          )
          try:
              urllib.request.urlopen(request, timeout=10)
          except urllib.error.HTTPError as error:
              print("status", error.code)
          PY
          wait_for_log "$before"
          seen=$(last_ip)
          echo "de outra rede, com X-Forwarded-For forjado, o bloqueio viu: $seen"
          test "$seen" != 203.0.113.77
          SUBNET="$internal" SEEN="$seen" python3 -c '
          import ipaddress, os
          assert ipaddress.ip_address(os.environ["SEEN"]) in ipaddress.ip_network(os.environ["SUBNET"])
          '

      - name: Run the retention inside the worker
        run: |
          worker=$(docker ps -q -f label=com.docker.swarm.service.name=gerador-planos_worker | head -n 1)
          docker exec -i "$worker" python - <<'PY'
          from app.deps import get_deps
          from app.retention import purge_expired

          print(purge_expired(get_deps()))
          PY

      - name: Run deploy.sh on the stack deployed by hand
        run: |
          # A adoção pode fixar a referência da imagem; o DB e o código binário não mudam.
          # Só depois da adoção a chamada idêntica deve preservar todas as tasks.
          cd "$CONF"
          running() {
            docker service ps --no-trunc --filter desired-state=running --format '{{.Name}} {{.ID}}' \
              gerador-planos_db gerador-planos_api gerador-planos_worker | sort
          }
          expected=$(docker image inspect --format '{{.Id}}' gerador-planos:ci)
          runtime() {
            python3 - "$expected" "${1:-initial}" <<'PY'
          import json
          import re
          import subprocess
          import sys

          def docker(*args):
              result = subprocess.run(["docker", *args], capture_output=True, text=True, timeout=30)
              if result.returncode: raise ValueError
              return result.stdout.strip()

          try:
              target, mode = sys.argv[1:]
              if not re.fullmatch(r"sha256:[a-f0-9]{64}", target): raise ValueError
              db = None
              fleet = []
              metadata = '{"id":{{json .Id}},"image":{{json .Image}},"running":{{json .State.Running}},"health":{{json .State.Health.Status}},"started":{{json .State.StartedAt}},"restarts":{{json .RestartCount}}}'
              for role in ("db", "api", "worker"):
                  service = f"gerador-planos_{role}"
                  replicas = int(docker("service", "inspect", "--format", "{{.Spec.Mode.Replicated.Replicas}}", service))
                  ids = docker("service", "ps", "-q", "--no-trunc", "--filter", "desired-state=running", service).split()
                  if replicas < 1 or len(ids) != replicas or len(set(ids)) != replicas: raise ValueError
                  if role == "db" and replicas != 1: raise ValueError
                  for task in ids:
                      cid = docker("inspect", "--type", "task", "--format", "{{.Status.ContainerStatus.ContainerID}}", task)
                      if not re.fullmatch(r"[a-f0-9]{64}", cid): raise ValueError
                      item = json.loads(docker("inspect", "--type", "container", "--format", metadata, cid))
                      if item["id"] != cid or item["running"] is not True or item["health"] != "healthy": raise ValueError
                      if role != "db" and item["image"] != target: raise ValueError
                      if not isinstance(item["started"], str) or not item["started"]: raise ValueError
                      if type(item["restarts"]) is not int or item["restarts"] < 0: raise ValueError
                      fleet.append({"role": role, "task": task, "container": cid, "started": item["started"], "restarts": item["restarts"]})
                      if role == "db":
                          db = {"task": task, "container": cid, "started": item["started"], "restarts": item["restarts"]}
              if mode in {"verified", "snapshot"}:
                  query = "select minimum_contract || ':' || phase from deployment_contract where id=1"
                  if docker("exec", db["container"], "sh", "-c", 'psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -tAc "$1"', "sh", query) != "3:verified": raise ValueError
              print(json.dumps(sorted(fleet, key=lambda row: (row["role"], row["task"])) if mode == "snapshot" else db, sort_keys=True))
          except Exception:
              print("A frota não confirmou identidade, saúde ou contrato do ensaio.", file=sys.stderr)
              raise SystemExit(1) from None
          PY
          }
          db_before=$(runtime)
          IMAGE=gerador-planos:ci ./deploy.sh
          test "$(runtime verified)" = "$db_before"
          stable=$(runtime snapshot)
          before=$(running)
          IMAGE=gerador-planos:ci ./deploy.sh
          after=$(running)
          if [ "$after" != "$before" ]; then
            echo "réplicas trocadas na chamada idêntica:"
            diff <(echo "$before") <(echo "$after") || true
            exit 1
          fi
          test "$(runtime verified)" = "$db_before"
          test "$(runtime snapshot)" = "$stable"

      - name: Update, break and go back with deploy.sh, including drained recovery
        run: |
          cd "$CONF"
          probe="$RUNNER_TEMP/probe.txt"
          start_probe() {
            rm -f "$RUNNER_TEMP/stop-probe"
            : > "$probe"
            ( while [ ! -e "$RUNNER_TEMP/stop-probe" ]; do
                $CURL -o /dev/null -w '%{http_code}\n' "https://$DOMAIN/healthz" >> "$probe" || echo 000 >> "$probe"
                sleep 0.2
              done ) &
            probe_pid=$!
          }
          stop_probe() {
            touch "$RUNNER_TEMP/stop-probe"
            wait "$probe_pid"
            echo "respostas durante as trocas rolling:"
            sort "$probe" | uniq -c
            test "$(grep -c . "$probe")" -gt 50
            if grep -qv '^200$' "$probe"; then
              echo "houve pedido sem 200 durante as trocas rolling"
              return 1
            fi
          }
          start_probe
          state() { docker service inspect --format '{{.UpdateStatus.State}}' "gerador-planos_$1"; }
          image() { docker service inspect --format '{{.Spec.TaskTemplate.ContainerSpec.Image}}' "gerador-planos_$1"; }
          running() {
            docker service ps --filter desired-state=running --format '{{.Name}} {{.ID}}' \
              gerador-planos_db gerador-planos_api gerador-planos_worker | sort
          }
          db() { docker ps -q -f label=com.docker.swarm.service.name=gerador-planos_db | head -n 1; }
          psql_db() { docker exec "$(db)" sh -c 'psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -tAc "$1"' sh "$1"; }
          role_tasks() { docker service ps -q --no-trunc --filter desired-state=running "gerador-planos_$1" | sort; }
          assert_image() {
            expected=$(docker image inspect --format '{{.Id}}' "$1")
            for role in api worker; do
              tasks=$(role_tasks "$role")
              test -n "$tasks"
              for task in $tasks; do
                container=$(docker inspect --type task --format '{{.Status.ContainerStatus.ContainerID}}' "$task")
                test -n "$container"
                test "$(docker inspect --type container --format '{{.Image}}' "$container")" = "$expected"
                test "$(docker inspect --type container --format '{{.State.Health.Status}}' "$container")" = healthy
              done
            done
          }
          assert_return_image() {
            expected=$(docker image inspect --format '{{.Id}}' "$1")
            for role in api worker; do
              previous=$(docker service inspect --format '{{.PreviousSpec.TaskTemplate.ContainerSpec.Image}}' "gerador-planos_$role")
              test -n "$previous"
              test "$(docker image inspect --format '{{.Id}}' "$previous")" = "$expected"
              test "$(docker service inspect --format '{{.PreviousSpec.Mode.Replicated.Replicas}}' "gerador-planos_$role")" -gt 0
            done
          }
          recovery_data() {
            # Só a impressão digital fica na variável; nenhum dado sintético é publicado no log.
            psql_db "select md5(jsonb_build_array((select jsonb_agg(to_jsonb(s) order by id) from submissions s), (select jsonb_agg(to_jsonb(f) order by id) from form_versions f), (select jsonb_agg(id order by id) from jobs), (select version_num from alembic_version))::text)"
          }
          versions() { docker service inspect --format '{{.Spec.Name}} {{.Version.Index}}' gerador-planos_api gerador-planos_worker; }

          echo "::group::1. versão nova: troca sem queda"
          # Outra tag do mesmo conteúdo vira o mesmo pin; o ensaio precisa de uma imagem distinta.
          printf 'FROM gerador-planos:ci\nLABEL ci.build=atualizacao\n' | docker build --quiet --tag gerador-planos:ci-novo - > /dev/null
          test "$(docker image inspect --format '{{.Id}}' gerador-planos:ci-novo)" != "$(docker image inspect --format '{{.Id}}' gerador-planos:ci)"
          api_before=$(role_tasks api)
          worker_before=$(role_tasks worker)
          db_before=$(role_tasks db)
          test -n "$api_before" && test -n "$worker_before" && test -n "$db_before"
          IMAGE=gerador-planos:ci-novo ./deploy.sh
          test "$(role_tasks api)" != "$api_before"
          test "$(role_tasks worker)" != "$worker_before"
          test "$(role_tasks db)" = "$db_before"
          for service in api worker; do
            echo "$service: $(state "$service"), $(image "$service")"
            test "$(state "$service")" = completed
            assert_image gerador-planos:ci-novo
          done
          echo "::endgroup::"

          echo "::group::2. versão quebrada: o Swarm desfaz e o deploy.sh sai com erro"
          # Em produção, o app recusa PUBLIC_BASE_URL sem https: a API e o worker não sobem.
          cp app.env "$RUNNER_TEMP/app.env.ok"
          sed -i "s|^PUBLIC_BASE_URL=.*|PUBLIC_BASE_URL=http://$DOMAIN|" app.env
          if IMAGE=gerador-planos:ci-novo ./deploy.sh > "$RUNNER_TEMP/broken.log" 2>&1; then
            cat "$RUNNER_TEMP/broken.log"
            echo "o deploy.sh devia ter acusado o rollback"
            exit 1
          fi
          cat "$RUNNER_TEMP/broken.log"
          grep -F 'gerador-planos_api (rollback_completed)' "$RUNNER_TEMP/broken.log"
          grep -F 'gerador-planos_worker (rollback_completed)' "$RUNNER_TEMP/broken.log"
          docker service inspect --format '{{json .Spec.TaskTemplate.ContainerSpec.Env}}' gerador-planos_api \
            | grep -q "PUBLIC_BASE_URL=https://$DOMAIN"
          for role in api worker; do
            test "$(docker service inspect --format '{{if .PreviousSpec}}present{{else}}absent{{end}}' "gerador-planos_$role")" = absent
          done
          echo "::endgroup::"

          # A janela sem promessa de disponibilidade começa somente após validar o rolling.
          stop_probe

          echo "::group::3. recuperação drenada; só a chamada seguinte preserva as tasks"
          # O rollback automático apaga PreviousSpec. O helper precisa pausar/drenar e
          # normalizar o retorno antes de atestar; essa recuperação pode trocar tasks.
          cp "$RUNNER_TEMP/app.env.ok" app.env
          db_before=$(role_tasks db)
          test -n "$db_before"
          data_before=$(recovery_data)
          test -n "$data_before"
          test "$(psql_db "select minimum_contract || ':' || phase from deployment_contract where id=1")" = 3:blocked
          # O wrapper observa o checkpoint real antes de migrate; não substitui o daemon.
          recovery_bin="$RUNNER_TEMP/recovery-bin"
          mkdir -p "$recovery_bin"
          export CI_RECOVERY_DOCKER="$(command -v docker)" CI_RECOVERY_PROOF="$RUNNER_TEMP/recovery-paused"
          rm -f "$CI_RECOVERY_PROOF"
          cat > "$recovery_bin/docker" <<'SH'
          #!/usr/bin/env bash
          set -euo pipefail
          if [[ "$1" == run && "${@: -1}" == migrate ]]; then
            for role in api worker; do
              service="gerador-planos_$role"
              test "$("$CI_RECOVERY_DOCKER" service inspect --format '{{.Spec.Mode.Replicated.Replicas}}' "$service")" = 0
              test "$("$CI_RECOVERY_DOCKER" service inspect --format '{{.PreviousSpec.Mode.Replicated.Replicas}}' "$service")" = 0
              containers=$("$CI_RECOVERY_DOCKER" ps -aq --no-trunc --filter "label=com.docker.swarm.service.name=$service")
              for container in $containers; do
                test "$("$CI_RECOVERY_DOCKER" inspect --type container --format '{{.State.Running}}:{{.State.Status}}' "$container")" = false:exited
              done
            done
            printf '%s\n' paused_and_exited > "$CI_RECOVERY_PROOF"
          fi
          exec "$CI_RECOVERY_DOCKER" "$@"
          SH
          chmod 700 "$recovery_bin/docker"
          PATH="$recovery_bin:$PATH" IMAGE=gerador-planos:ci-novo ./deploy.sh
          test "$(cat "$CI_RECOVERY_PROOF")" = paused_and_exited
          test "$(role_tasks db)" = "$db_before"
          test "$(recovery_data)" = "$data_before"
          assert_image gerador-planos:ci-novo
          assert_return_image gerador-planos:ci-novo
          test "$(psql_db "select minimum_contract || ':' || phase from deployment_contract where id=1")" = 3:verified
          before=$(running)
          IMAGE=gerador-planos:ci-novo ./deploy.sh
          after=$(running)
          if [ "$after" != "$before" ]; then
            echo "réplicas trocadas:"
            diff <(echo "$before") <(echo "$after") || true
            exit 1
          fi
          echo "::endgroup::"

          test "$(recovery_data)" = "$data_before"
          assert_image gerador-planos:ci-novo
          assert_return_image gerador-planos:ci-novo
          test "$(psql_db "select minimum_contract || ':' || phase from deployment_contract where id=1")" = 3:verified

          echo "::group::4. volta para a versão anterior com o banco à frente da imagem"
          # A recuperação terminou com frota saudável, retorno normalizado e contrato3 verificado.
          start_probe
          # Status/begin aceitam o piso compatível, mas migrate recusa a revisão desconhecida.
          # Os serviços não mudam e o gate fica bloqueado; o retorno explícito não roda migration.
          head=$(psql_db 'select version_num from alembic_version')
          psql_db "update alembic_version set version_num = 'ci_futura'"
          before=$(versions)
          if IMAGE=gerador-planos:ci ./deploy.sh > "$RUNNER_TEMP/back-sem-rollback.log" 2>&1; then
            cat "$RUNNER_TEMP/back-sem-rollback.log"
            echo "sem ROLLBACK=1, o deploy.sh devia ter parado"
            exit 1
          fi
          cat "$RUNNER_TEMP/back-sem-rollback.log"
          grep -F 'deploy.sh: migrations com ' "$RUNNER_TEMP/back-sem-rollback.log"
          grep -F 'revisão incompatível' "$RUNNER_TEMP/back-sem-rollback.log"
          grep -F 'a imagem não foi atualizada' "$RUNNER_TEMP/back-sem-rollback.log"
          test "$(versions)" = "$before"
          test "$(psql_db "select minimum_contract || ':' || phase from deployment_contract where id=1")" = 3:blocked
          ROLLBACK=1 IMAGE=gerador-planos:ci ./deploy.sh > "$RUNNER_TEMP/back.log" 2>&1 || { cat "$RUNNER_TEMP/back.log"; exit 1; }
          cat "$RUNNER_TEMP/back.log"
          grep -F 'sem migrations' "$RUNNER_TEMP/back.log"
          if grep -F 'deploy.sh: migrations com ' "$RUNNER_TEMP/back.log"; then
            echo 'ROLLBACK=1 não devia executar migrations'
            exit 1
          fi
          test "$(psql_db 'select version_num from alembic_version')" = ci_futura
          psql_db "update alembic_version set version_num = '$head'"
          for service in api worker; do
            echo "$service: $(state "$service"), $(image "$service")"
            test "$(state "$service")" = completed
            assert_image gerador-planos:ci
          done
          echo "::endgroup::"

          echo "::group::5. banco indisponível no preflight: serviços preservados e nenhuma migration"
          # A conexão falha em contract(status), antes de begin/migrate ou atualização de serviços.
          before=$(versions)
          sed -i 's|@gerador-planos_db:|@gerador-planos_sem-banco:|' app.env
          if IMAGE=gerador-planos:ci ./deploy.sh > "$RUNNER_TEMP/preflight-db.log" 2>&1; then
            cat "$RUNNER_TEMP/preflight-db.log"
            echo "o deploy.sh devia ter recusado o banco indisponível no preflight"
            exit 1
          fi
          cat "$RUNNER_TEMP/preflight-db.log"
          grep -F 'O banco não confirmou o contrato; a stack não foi mexida.' "$RUNNER_TEMP/preflight-db.log"
          if grep -F 'deploy.sh: migrations com ' "$RUNNER_TEMP/preflight-db.log"; then
            echo "o preflight indisponível não devia chamar migrations"
            exit 1
          fi
          test "$(versions)" = "$before"
          cp "$RUNNER_TEMP/app.env.ok" app.env
          echo "::endgroup::"

          echo "::group::6. DOMAIN diferente do PUBLIC_BASE_URL: nada é mexido"
          before=$(versions)
          if DOMAIN=outro.ci.test IMAGE=gerador-planos:ci ./deploy.sh > "$RUNNER_TEMP/domain.log" 2>&1; then
            cat "$RUNNER_TEMP/domain.log"
            echo "o deploy.sh devia ter recusado o DOMAIN diferente"
            exit 1
          fi
          cat "$RUNNER_TEMP/domain.log"
          grep -F 'difere do domínio do PUBLIC_BASE_URL' "$RUNNER_TEMP/domain.log"
          test "$(versions)" = "$before"
          echo "::endgroup::"

          echo "::group::7. tag reaproveitada: o conteúdo verificado fica fixado por identidade"
          # Mesmo nome e imagem nova: o helper usa referência de conteúdo e confere o ID real.
          previous=$(docker image inspect --format '{{.Id}}' gerador-planos:ci)
          old_api_ref=$(docker service inspect --format '{{.Spec.TaskTemplate.ContainerSpec.Image}}' gerador-planos_api)
          old_worker_ref=$(docker service inspect --format '{{.Spec.TaskTemplate.ContainerSpec.Image}}' gerador-planos_worker)
          for ref in "$old_api_ref" "$old_worker_ref" "$previous"; do
            test "$(docker image inspect --format '{{.Id}}' "$ref")" = "$previous"
          done
          printf 'FROM gerador-planos:ci\nLABEL ci.build=reaproveitada\n' | docker build --quiet --tag gerador-planos:ci - > /dev/null
          test "$(docker image inspect --format '{{.Id}}' gerador-planos:ci)" != "$previous"
          # O retag preserva a resolução e o conteúdo histórico, sem alias de resgate no ensaio.
          for ref in "$old_api_ref" "$old_worker_ref" "$previous"; do
            test "$(docker image inspect --format '{{.Id}}' "$ref")" = "$previous"
          done
          if ! IMAGE=gerador-planos:ci ./deploy.sh > "$RUNNER_TEMP/stale.log" 2>&1; then
            cat "$RUNNER_TEMP/stale.log"
            exit 1
          fi
          cat "$RUNNER_TEMP/stale.log"
          assert_image gerador-planos:ci
          for role in api worker; do
            return_ref=$(docker service inspect --format '{{.PreviousSpec.TaskTemplate.ContainerSpec.Image}}' "gerador-planos_$role")
            test "$(docker image inspect --format '{{.Id}}' "$return_ref")" = "$previous"
            test "$(docker service inspect --format '{{.PreviousSpec.Mode.Replicated.Replicas}}' "gerador-planos_$role")" -gt 0
          done
          grep -F 'contrato participante verificado' "$RUNNER_TEMP/stale.log"
          echo "::endgroup::"

          stop_probe

      - name: Back up Postgres with backup.sh
        run: |
          BACKUP_DIR="$RUNNER_TEMP/backups" deploy/swarm/backup.sh
          ls -l "$RUNNER_TEMP/backups"
          dump=$(ls "$RUNNER_TEMP"/backups/mcc-*.dump)
          db=$(docker ps -q -f label=com.docker.swarm.service.name=gerador-planos_db | head -n 1)
          docker exec -i "$db" pg_restore --list < "$dump" > "$RUNNER_TEMP/backup.list"
          grep -E ' TABLE public (leads|submissions|jobs) ' "$RUNNER_TEMP/backup.list"

      - name: Remove the stack, keep the volume and deploy again with deploy.sh
        run: |
          docker stack rm gerador-planos
          stack_removed() {
            local containers services networks
            cleanup_state=containers_unavailable
            containers=$(docker ps -aq --no-trunc -f label=com.docker.stack.namespace=gerador-planos 2>/dev/null) || return 1
            cleanup_state=services_unavailable
            services=$(docker service ls --filter label=com.docker.stack.namespace=gerador-planos --format '{{.Name}}' 2>/dev/null) || return 1
            cleanup_state=networks_unavailable
            networks=$(docker network ls --format '{{.Name}}' 2>/dev/null) || return 1
            cleanup_state=containers_pending
            test -z "$containers" || return 1
            cleanup_state=services_pending
            test -z "$services" || return 1
            cleanup_state=network_pending
            if grep -Fxq gerador-planos_internal <<< "$networks"; then return 1; fi
            cleanup_state=removed
            return 0
          }
          for _ in $(seq 1 60); do
            if stack_removed; then break; fi
            sleep 2
          done
          if ! stack_removed; then
            printf '{"stage":"stack_removal","reason":"%s"}\n' "$cleanup_state"
            echo 'A remoção da stack não foi comprovada; não recrie os serviços.'
            exit 1
          fi
          printf '{"stage":"stack_removal","reason":"removed"}\n'
          docker volume inspect --format '{{.Name}} continua' gerador-planos_pgdata
          # O volume mantém piso2. Sem rede, o helper cria API/worker pausados, aguarda DB/migration
          # e só depois sobe os runtimes compatíveis; a limpeza anterior não ignora órfãos parados.
          cd "$CONF"
          IMAGE=gerador-planos:ci ./deploy.sh
          for _ in $(seq 1 30); do
            [ "$($CURL -o /dev/null -w '%{http_code}' "https://$DOMAIN/readyz")" = 200 ] && break
            sleep 2
          done
          $CURL --fail "https://$DOMAIN/readyz"
          echo

      - name: Start a second stack next to the first, with its own name and domain
        run: |
          # A pasta da segunda stack: a mesma configuração, com STACK_NAME, domínio e host do banco
          # próprios (README, "Duas stacks no mesmo servidor").
          conf_b="$RUNNER_TEMP/swarm-b"
          echo "CONF_B=$conf_b" >> "$GITHUB_ENV"
          mkdir -p "$conf_b"
          cp "$CONF/stack.yaml" "$CONF/deploy.sh" "$CONF/rollout.py" "$CONF/app.env" "$CONF/db.env" "$conf_b/"
          python3 - "$conf_b/app.env" "$DOMAIN_B" gerador-planos-b <<'PY'
          import re
          import sys
          from pathlib import Path
          from urllib.parse import urlsplit, urlunsplit

          filename, domain, stack = sys.argv[1:]
          path = Path(filename)
          text = path.read_text()
          values = dict(
              line.split("=", 1) for line in text.splitlines()
              if line and not line.startswith("#") and "=" in line
          )
          url = urlsplit(values["DATABASE_URL"])
          assert url.hostname == f"{values['STACK_NAME']}_db"
          credentials = url.netloc.rsplit("@", 1)[0]
          changed = {
              "PUBLIC_BASE_URL": f"https://{domain}",
              "STACK_NAME": stack,
              "DATABASE_URL": urlunsplit(
                  url._replace(netloc=f"{credentials}@{stack}_db:{url.port or 5432}")
              ),
          }
          for key, value in changed.items():
              text, count = re.subn(rf"^{key}=.*$", lambda _: f"{key}={value}", text, flags=re.M)
              assert count == 1, key
          path.write_text(text)
          PY
          cd "$conf_b"
          # O DOMAIN do job é o da primeira stack: o deploy.sh da segunda lê o dela do app.env.
          env -u DOMAIN IMAGE=gerador-planos:ci ./deploy.sh > "$RUNNER_TEMP/deploy-b.log" 2>&1 || { cat "$RUNNER_TEMP/deploy-b.log"; exit 1; }
          cat "$RUNNER_TEMP/deploy-b.log"
          grep -F 'gerador-planos-b no ar com gerador-planos:ci' "$RUNNER_TEMP/deploy-b.log"
          docker stack ls
          for service in db api worker; do
            container=$(docker ps -q -f "label=com.docker.swarm.service.name=gerador-planos-b_$service" | head -n 1)
            health=$(docker inspect --format '{{.State.Health.Status}}' "$container")
            echo "gerador-planos-b_$service: $health"
            test "$health" = healthy
          done

      - name: Import the neutral demo explicitly in the second Swarm database
        run: |
          docker run --rm -i --network gerador-planos-b_internal --env-file "$CONF_B/app.env" gerador-planos:ci python -c 'from app.deps import get_deps; from app.forms.stored import import_definition; import sys; import_definition(get_deps(), sys.stdin.buffer.read(), actor="ci")' < examples/demo.json

      - name: Check that both stacks answer, each on its own domain
        run: |
          # O Traefik lê os serviços do Swarm a cada 15 s. Com os nomes iguais ele descartaria os
          # dois routers, e a primeira stack também deixaria de responder.
          for domain in "$DOMAIN_B" "$DOMAIN"; do
            for _ in $(seq 1 30); do
              [ "$($CURL -o /dev/null -w '%{http_code}' "https://$domain/readyz")" = 200 ] && break
              sleep 2
            done
            $CURL --fail "https://$domain/readyz"
            echo
            $CURL -o /dev/null -D - "https://$domain/readyz" | tr -d '\r' \
              | grep -i '^strict-transport-security: max-age=31536000$'
            $CURL --fail -o /dev/null "https://$domain/p/demo"
          done
          # Cada router é da sua stack: a regra, os middlewares e o IP virtual do serviço da stack.
          STACKS="gerador-planos:$DOMAIN gerador-planos-b:$DOMAIN_B" python3 - <<'PY'
          import json
          import os
          import subprocess
          import urllib.request
          from urllib.parse import urlsplit


          def get(path):
              with urllib.request.urlopen("http://127.0.0.1:9000/api/http/" + path, timeout=10) as response:
                  return json.load(response)


          for pair in os.environ["STACKS"].split():
              stack, domain = pair.split(":")
              router = get(f"routers/{stack}@docker")
              service = get(f"services/{stack}@docker")
              assert router["status"] == "enabled", router
              assert router["rule"] == f"Host(`{domain}`)", router["rule"]
              assert router["entryPoints"] == ["websecure"], router["entryPoints"]
              assert router["tls"]["certResolver"] == "letsencrypt", router["tls"]
              middlewares = [name.split("@")[0] for name in router["middlewares"]]
              assert middlewares == [f"{stack}-hsts", f"{stack}-compress"], middlewares
              inspect = subprocess.run(
                  ["docker", "service", "inspect", "--format", "{{range .Endpoint.VirtualIPs}}{{.Addr}} {{end}}", f"{stack}_api"],
                  capture_output=True, text=True, check=True,
              )
              vips = {vip.split("/")[0] for vip in inspect.stdout.split()}
              servers = [urlsplit(s["url"]) for s in service["loadBalancer"]["servers"]]
              assert [s.port for s in servers] == [8000], servers
              assert servers[0].hostname in vips, (stack, servers, vips)
              print(stack, "->", domain, "ok")
          PY

      - name: Refuse the wrong config folder and a STACK that is not the folder's
        run: |
          # A pasta da segunda stack sem o STACK_NAME cairia no nome da primeira e trocaria o domínio
          # dela. O deploy.sh recusa sem mexer em nada: nenhuma réplica trocada, o router da
          # primeira como estava e as duas stacks respondendo.
          wrong="$RUNNER_TEMP/swarm-wrong"
          cp -r "$CONF_B" "$wrong"
          sed -i '/^STACK_NAME=/d' "$wrong/app.env"
          versions() {
            docker service inspect --format '{{.Spec.Name}} {{.Version.Index}}' \
              gerador-planos_db gerador-planos_api gerador-planos_worker \
              gerador-planos-b_db gerador-planos-b_api gerador-planos-b_worker
          }
          before=$(versions)
          rule='{{index .Spec.Labels "traefik.http.routers.gerador-planos.rule"}}'
          test "$(docker service inspect --format "$rule" gerador-planos_api)" = "Host(\`$DOMAIN\`)"

          # Sem o DOMAIN do job, que é o da primeira stack: o que recusa aqui é o router no ar.
          cd "$wrong"
          if env -u DOMAIN IMAGE=gerador-planos:ci ./deploy.sh > "$RUNNER_TEMP/wrong.log" 2>&1; then
            cat "$RUNNER_TEMP/wrong.log"
            echo "o deploy.sh devia ter recusado a pasta da outra stack"
            exit 1
          fi
          cat "$RUNNER_TEMP/wrong.log"
          grep -F 'a stack gerador-planos está no ar com o router' "$RUNNER_TEMP/wrong.log"
          grep -F "$DOMAIN_B" "$RUNNER_TEMP/wrong.log"
          grep -F 'nada foi mexido' "$RUNNER_TEMP/wrong.log"

          cd "$CONF_B"
          if env -u DOMAIN STACK=gerador-planos IMAGE=gerador-planos:ci ./deploy.sh > "$RUNNER_TEMP/env-stack.log" 2>&1; then
            cat "$RUNNER_TEMP/env-stack.log"
            echo "o deploy.sh devia ter recusado o STACK diferente do STACK_NAME"
            exit 1
          fi
          cat "$RUNNER_TEMP/env-stack.log"
          grep -F 'STACK=gerador-planos difere do STACK_NAME do app.env (gerador-planos-b)' "$RUNNER_TEMP/env-stack.log"

          test "$(versions)" = "$before"
          test "$(docker service inspect --format "$rule" gerador-planos_api)" = "Host(\`$DOMAIN\`)"
          for domain in "$DOMAIN" "$DOMAIN_B"; do
            $CURL --fail "https://$domain/readyz"
            echo
          done

      - name: Deploy the first stack again with the second one up
        run: |
          # Cada pasta continua atualizando a sua stack: nenhuma réplica de nenhuma das duas troca.
          running() {
            docker service ps --filter desired-state=running --format '{{.Name}} {{.ID}}' \
              gerador-planos_db gerador-planos_api gerador-planos_worker \
              gerador-planos-b_db gerador-planos-b_api gerador-planos-b_worker | sort
          }
          before=$(running)
          (cd "$CONF" && IMAGE=gerador-planos:ci ./deploy.sh)
          (cd "$CONF_B" && env -u DOMAIN IMAGE=gerador-planos:ci ./deploy.sh)
          after=$(running)
          if [ "$after" != "$before" ]; then
            echo "réplicas trocadas:"
            diff <(echo "$before") <(echo "$after") || true
            exit 1
          fi

      - name: Tune the second stack through its app.env, and refuse values that do not serve
        run: |
          # Os ajustes do app.env chegam ao Swarm pelo deploy.sh: o teto de memória da API, e a média e
          # a rajada do limite de envios no Traefik. A primeira stack segue com os padrões.
          cd "$CONF_B"
          cp app.env "$RUNNER_TEMP/app-b.env.ok"
          versions() {
            docker service inspect --format '{{.Spec.Name}} {{.Version.Index}}' \
              gerador-planos_api gerador-planos-b_db gerador-planos-b_api gerador-planos-b_worker
          }
          rate() {
            curl -fsS "http://127.0.0.1:9000/api/http/middlewares/$1-ratelimit@docker" \
              | python3 -c 'import json, sys; rate = json.load(sys.stdin)["rateLimit"]; print(rate["average"], rate["burst"])'
          }

          # Um valor que o Traefik ou o Docker não leriam: o deploy.sh para sem mexer em nada.
          before=$(versions)
          for bad in RATE_LIMIT_BURST=abc API_MEMORY_LIMIT=512MiB; do
            echo "$bad" >> app.env
            if env -u DOMAIN IMAGE=gerador-planos:ci ./deploy.sh > "$RUNNER_TEMP/bad.log" 2>&1; then
              cat "$RUNNER_TEMP/bad.log"
              echo "o deploy.sh devia ter recusado $bad"
              exit 1
            fi
            cat "$RUNNER_TEMP/bad.log"
            grep -F "${bad%%=*}=${bad#*=} não serve" "$RUNNER_TEMP/bad.log"
            cp "$RUNNER_TEMP/app-b.env.ok" app.env
          done
          test "$(versions)" = "$before"

          # Valores bons: a segunda stack muda, a primeira não.
          printf '%s\n' RATE_LIMIT_AVERAGE=7 RATE_LIMIT_BURST=9 API_MEMORY_LIMIT=640M >> app.env
          env -u DOMAIN IMAGE=gerador-planos:ci ./deploy.sh
          limit=$(docker service inspect --format '{{.Spec.TaskTemplate.Resources.Limits.MemoryBytes}}' gerador-planos-b_api)
          echo "gerador-planos-b_api: teto $limit"
          test "$limit" = "$((640 * 1024 * 1024))"
          test "$(docker service inspect --format '{{.Spec.TaskTemplate.Resources.Limits.MemoryBytes}}' gerador-planos_api)" = "$((512 * 1024 * 1024))"
          # O Traefik lê o Swarm a cada 15 s.
          for _ in $(seq 1 30); do
            [ "$(rate gerador-planos-b)" = "7 9" ] && break
            sleep 2
          done
          test "$(rate gerador-planos-b)" = "7 9"
          test "$(rate gerador-planos)" = "10 20"

          # E o limite novo vale no router: com rajada de 9, a segunda stack barra antes da primeira.
          : > "$RUNNER_TEMP/posts-b"
          for _ in $(seq 25); do
            $CURL -o /dev/null -w '%{http_code}\n' -X POST -H 'Content-Type: application/json' --data '{}' \
              "https://$DOMAIN_B/v1/forms/demo/submissions" >> "$RUNNER_TEMP/posts-b"
          done
          sort "$RUNNER_TEMP/posts-b" | uniq -c
          test "$(grep -c '^422$' "$RUNNER_TEMP/posts-b")" -ge 7
          test "$(grep -c '^422$' "$RUNNER_TEMP/posts-b")" -le 14
          test "$(grep -c '^429$' "$RUNNER_TEMP/posts-b")" -ge 8

      - name: Back up the second stack with backup.sh
        run: |
          STACK=gerador-planos-b BACKUP_DIR="$RUNNER_TEMP/backups-b" deploy/swarm/backup.sh
          dump=$(ls "$RUNNER_TEMP"/backups-b/mcc-*.dump)
          db=$(docker ps -q -f label=com.docker.swarm.service.name=gerador-planos-b_db | head -n 1)
          docker exec -i "$db" pg_restore --list < "$dump" > "$RUNNER_TEMP/backup-b.list"
          grep -E ' TABLE public (leads|submissions|jobs) ' "$RUNNER_TEMP/backup-b.list"
          # Um nome que não é de nenhuma stack não cai no banco da outra.
          if STACK=nao-existe BACKUP_DIR="$RUNNER_TEMP/backups-x" deploy/swarm/backup.sh; then
            echo "o backup.sh devia ter falhado para uma stack que não existe"
            exit 1
          fi

      - name: Show the state and the logs
        if: failure()
        run: |
          docker service ls || true
          for service in $(docker service ls --format '{{.Name}}' 2>/dev/null); do
            echo "::group::$service"
            docker service ps --no-trunc "$service" || true
            docker service logs --no-trunc --tail 200 "$service" 2>&1 || true
            echo "::endgroup::"
          done
          echo "::group::hatchet-lite"
          docker logs --tail 200 hatchet-lite 2>&1 || true
          echo "::endgroup::"

      - name: Clean isolated adoption resources after proven exit
        if: always()
        run: |
          folder="$RUNNER_TEMP/swarm-compat"
          compat=leadkit-compat
          if [ ! -f "$folder/rollout.py" ]; then exit 0; fi
          python3 - "$folder" "$compat" <<'PYCLEAN'
          import sys
          sys.path.insert(0, sys.argv[1])
          from rollout import Rollout
          try:
              rollout = Rollout(sys.argv[1], "", sys.argv[2], False)
              rollout.node = rollout.docker("info", "--format", "{{.Swarm.NodeID}}").stdout.strip()
              rollout.quiesce()
          except Exception:
              raise SystemExit(1) from None
          PYCLEAN
          docker stack rm "$compat" >/dev/null 2>&1 || true
          # A rede pode sumir antes dos containers: observar a stack inteira e vínculos do volume.
          for _ in $(seq 1 60); do
            remaining_services=$(docker service ls --filter "label=com.docker.stack.namespace=$compat" --format '{{.ID}}') || exit 1
            remaining_networks=$(docker network ls --filter "label=com.docker.stack.namespace=$compat" --format '{{.ID}}') || exit 1
            stack_containers=$(docker ps -aq --filter "label=com.docker.stack.namespace=$compat") || exit 1
            attached=$(docker ps -aq --filter "volume=${compat}_pgdata") || exit 1
            containers=$(printf '%s\n%s\n' "$stack_containers" "$attached" | sort -u) || exit 1
            for container in $containers; do
              container_state=$(docker inspect --format '{{.State.Running}}:{{.State.Status}}:{{index .Config.Labels "com.docker.stack.namespace"}}' "$container") || exit 1
              case "$container_state" in
                "false:exited:$compat"|"false:dead:$compat")
                  # Sem force: só remover o container próprio depois da saída positivamente observada.
                  docker rm "$container" >/dev/null 2>&1 || exit 1 ;;
                "true:running:$compat"|"true:restarting:$compat"|"true:paused:$compat"|"false:created:$compat"|"false:removing:$compat") ;;
                *) exit 1 ;;
              esac
            done
            if [ -z "$remaining_services$remaining_networks$stack_containers$attached" ]; then break; fi
            sleep 2
          done
          [ -z "$remaining_services$remaining_networks$stack_containers$attached" ] || exit 1
          # Falha de observação não significa volume ausente; a lista precisa ser consultável.
          remaining_volumes=$(docker volume ls --format '{{.Name}}') || exit 1
          if printf '%s\n' "$remaining_volumes" | grep -Fxq "${compat}_pgdata"; then
            docker volume rm "${compat}_pgdata" >/dev/null 2>&1 || exit 1
          fi
          python3 - "$folder" "$RUNNER_TEMP/continuation-probe.py" <<'PY'
          import shutil
          import sys
          from pathlib import Path
          root = Path(sys.argv[1])
          shutil.rmtree(root / "proof", ignore_errors=True)
          for path in (root / "app.env", root / "db.env", Path(sys.argv[2])):
              path.unlink(missing_ok=True)
          print('{"stage":"cleanup","result":"proved"}')
          PY

  validation:
    if: always()
    needs: [changes, image, swarm]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require image and the applicable Swarm validation
        env:
          SWARM_REQUIRED: ${{ needs.changes.outputs.swarm }}
        run: |
          test "${{ needs.changes.result }}" = success
          test "${{ needs.image.result }}" = success
          if [ "$SWARM_REQUIRED" = true ]; then
            test "${{ needs.swarm.result }}" = success
          else
            test "${{ needs.swarm.result }}" = skipped
          fi
