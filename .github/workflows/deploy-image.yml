name: Deploy image

# Valida a imagem e o Swarm sem publicar. Chamado pelo Tests do mesmo commit.
# Conserva os ensaios de atualização, rollback, backup, autenticação e isolamento entre stacks.
on:
  workflow_call:

permissions:
  contents: read

env:
  # Por padrão o build-push-action sobe um artefato `.dockerbuild` por build (dois por execução),
  # que ocupa o armazenamento do repositório privado e ninguém abre.
  DOCKER_BUILD_RECORD_UPLOAD: "false"

jobs:
  changes:
    # Decide se o `swarm` roda. Fora de um PR (push em main) e num PR para main, sempre; nos outros
    # PRs, só se algum arquivo mudado está na lista abaixo: o que o swarm exercita e os Tests não
    # cobrem, ou seja, o empacotamento (Dockerfile e o que entra na imagem, deploy/, as
    # dependências, este workflow) e o que a stack liga de verdade (a configuração do app em
    # produção, as migrations, a API e o worker subindo, o login do admin atrás do Traefik, a
    # conexão com o Hatchet). Mudança de regra de negócio, de página, de formulário e de teste fica
    # com o Tests e o `image`. Se o filtro falhar, o PR fica vermelho: não se pula o swarm em silêncio.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read  # o filtro lista os arquivos do PR pela API, sem checkout
    outputs:
      swarm: ${{ github.event_name != 'pull_request' || github.base_ref == 'main' || steps.filter.outputs.swarm == 'true' }}
    steps:
      - name: List what the pull request changes
        id: filter
        if: github.event_name == 'pull_request'
        # As actions de terceiros ficam fixadas pelo commit da tag (a versão vai ao lado).
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d  # v4.0.3
        with:
          filters: |
            swarm:
              - 'deploy/**'
              - 'Dockerfile'
              - '.dockerignore'
              - '.github/workflows/deploy-image.yml'
              - '.github/workflows/tests.yml'
              - 'examples/**'
              - 'pyproject.toml'
              - 'uv.lock'
              - 'app/alembic.ini'
              - 'app/migrations/**'
              - 'app/settings.py'
              - 'app/db.py'
              - 'app/deployment_contract.py'
              - 'app/hatchet_client.py'
              - 'app/worker.py'
              - 'app/api/main.py'
              - 'app/admin/auth.py'

  image:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      APP_IMAGE_TAG: ci
      COMPOSE: docker compose -f deploy/compose.yaml
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      # O cache de camadas (a base, o apt e as dependências do uv.lock) vem do cache do Actions e é
      # compartilhado entre o `image` e o `swarm`: veja o cabeçalho do arquivo.
      # `use: false`: só o passo de build usa este builder, e `load: true` põe a imagem no Docker do
      # runner, de onde os passos seguintes a usam pela tag local.
      - name: Set up Buildx
        id: buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1
        with:
          use: false

      - name: Build the image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          builder: ${{ steps.buildx.outputs.name }}
          tags: leadkit:ci
          load: true
          provenance: false
          cache-from: type=gha,scope=leadkit
          cache-to: type=gha,mode=max,scope=leadkit,ignore-error=true

      - name: Verify the installed image matches its sources
        run: |
          docker run --rm --network none --read-only -i leadkit:ci \
            python -I - --image < tests_app/test_packaging.py

      - name: Render every form's example PDF inside the image
        run: |
          docker run --rm -i -v "$PWD/examples:/examples:ro" leadkit:ci python -I - <<'PY'
          import json
          from datetime import UTC, datetime
          from pathlib import Path

          from app.adapters.weasyprint_pdf import WeasyPrintRenderer
          from app.forms import starter
          from app.forms.definition import compile_definition


          renderer = WeasyPrintRenderer()
          # O demo neutro é importado explicitamente nos bancos de CI; não existe seed no startup.
          documents = [json.loads(Path("/examples/demo.json").read_text(encoding="utf-8"))]
          documents.append(starter.definition(slug="modelo-inicial", title="Modelo inicial"))
          assert len(documents) == 2, len(documents)
          for document in documents:
              spec = compile_definition(document)
              # As notas das respostas de exemplo, que o pedido de verdade grava no envio.
              answers = spec.answers_model.model_validate(document["examples"]["answers"])
              context = {
                  "lead": {"name": "Imagem de Teste"},
                  "form": {"slug": spec.slug, "title": spec.title},
                  "scores": spec.score(answers).scores if spec.score else {},
                  "generated_at": datetime.now(UTC),
              }
              pdf = renderer.render(spec, spec.example_plan, context)
              assert pdf.content.startswith(b"%PDF"), spec.slug
              print(spec.slug, pdf.page_count, "page(s)", len(pdf.content), "bytes")
          PY

      - name: Write a dummy deploy/.env from the example
        run: |
          python3 - <<'PY'
          import base64
          import json
          import re
          from pathlib import Path
          from urllib.parse import quote


          def b64(data):
              return base64.urlsafe_b64encode(json.dumps(data).encode()).decode().rstrip("=")


          # Token só no formato JWT (não é credencial): o SDK do Hatchet valida o formato ao subir.
          claims = {
              "sub": "00000000-0000-0000-0000-000000000001",
              "server_url": "http://localhost:8888",
              "grpc_broadcast_address": "localhost:7077",
          }
          text = Path("deploy/.env.example").read_text()

          def required(name):
              found = re.findall(rf"^{name}=(.+)$", text, flags=re.M)
              assert len(found) == 1 and found[0].strip(), name
              return found[0].strip()

          user, database = required("POSTGRES_USER"), required("POSTGRES_DB")
          password = "ci0123456789abcdef"
          dummy = {
              "POSTGRES_PASSWORD": password,
              "DATABASE_URL": (
                  f"postgresql+psycopg://{quote(user, safe='')}:{password}"
                  f"@postgres:5432/{quote(database, safe='')}"
              ),
              "TOKEN_SECRETS": "ci-token-secret-0123456789abcdefghijklmnop",
              "OPENAI_API_KEY": "sk-ci-dummy",
              "S3_BUCKET": "ci-bucket",
              "HATCHET_CLIENT_TOKEN": f"{b64({'alg': 'none', 'typ': 'JWT'})}.{b64(claims)}.offline",
          }
          for key, value in dummy.items():
              text, found = re.subn(rf"^{key}=.*$", f"{key}={value}", text, flags=re.M)
              assert found == 1, key
          Path("deploy/.env").write_text(text)
          PY

      - name: Validate the compose file
        run: $COMPOSE config --quiet

      - name: Validate the Caddyfile
        run: >-
          docker run --rm -e DOMAIN=planos.example.test
          -v "$PWD/deploy/Caddyfile:/etc/caddy/Caddyfile:ro"
          caddy:2 caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile

      - name: Start Postgres, migrations and the API
        run: |
          $COMPOSE up --detach --no-build api
          for _ in $(seq 1 45); do
            status=$(docker inspect --format '{{.State.Health.Status}}' "$($COMPOSE ps -q api)")
            [ "$status" = healthy ] && break
            sleep 2
          done
          $COMPOSE ps --all
          test "$status" = healthy

      - name: Import the neutral demo explicitly in the CI database
        run: |
          $COMPOSE exec -T api python -c 'from app.deps import get_deps; from app.forms.stored import import_definition; import sys; import_definition(get_deps(), sys.stdin.buffer.read(), actor="ci")' < examples/demo.json

      - name: Request pages from inside the API container
        run: |
          $COMPOSE exec -T api python - <<'PY'
          import urllib.request

          for path in ("/readyz", "/healthz", "/p/demo", "/static/css/public.css", "/admin/login"):
              with urllib.request.urlopen("http://127.0.0.1:8000" + path, timeout=5) as response:
                  assert response.status == 200, (path, response.status)
                  print(path, response.status)
          PY

      - name: Load the worker settings and run the retention once
        run: |
          $COMPOSE run --rm --no-deps -T worker python - <<'PY'
          import app.worker  # noqa: F401  (importa workflows e crons como o worker)
          from app.deps import get_deps
          from app.retention import purge_expired

          print(purge_expired(get_deps()))
          PY

      - name: Validate the Swarm stack file
        # Depois do compose: o `docker stack config` pode exigir um nó do Swarm, e o runner vira um.
        run: |
          docker swarm init >/dev/null 2>&1 || true
          cp deploy/swarm/app.env.example deploy/swarm/app.env
          cp deploy/swarm/db.env.example deploy/swarm/db.env
          IMAGE=gerador-planos:ci DOMAIN=planos.example.test \
            docker stack config -c deploy/swarm/stack.yaml > /dev/null

      - name: Show the logs
        if: failure()
        run: $COMPOSE logs --no-color

      - name: Stop the stack
        if: always()
        run: $COMPOSE down --volumes || true  # sem deploy/.env (falha antes dele) não há o que parar

  swarm:
    needs: changes
    if: needs.changes.outputs.swarm == 'true'
    # A stack de deploy/swarm/ como no servidor: Swarm de um nó, Traefik v2.11 com os argumentos do
    # servidor e uma pasta de configuração igual à dele. Um Hatchet Lite faz o worker passar no
    # healthcheck. O deploy.sh passa pela atualização, pela versão quebrada que o Swarm desfaz, pela
    # volta de versão e pelo primeiro deploy, sem nenhum pedido sem 200 nas trocas. No fim, uma
    # segunda stack sobe ao lado da primeira, com outro nome e outro domínio.
    runs-on: ubuntu-latest
    # Bootstrap, atualização/rollback e duas stacks somam quase 30 min; reserve margem no runner.
    timeout-minutes: 45
    # Baselines públicas0/1/2 separadas; todas adotam o candidato3 com pausa comprovada.
    strategy:
      fail-fast: false
      matrix:
        adoption_baseline: [pre-projection, contract-one, contract-two]
    env:
      CI_ADOPTION_BASELINE: ${{ matrix.adoption_baseline }}
      DOMAIN: planos.ci.test
      # O domínio e a pasta de configuração da segunda stack, gerador-planos-b.
      DOMAIN_B: planos-b.ci.test
      # Nomes internos dos ensaios: explícitos, sem depender do padrão dos exemplos públicos.
      CI_STACK_NAME: gerador-planos
      # curl até o Traefik do runner, com os domínios de mentira apontados para ele.
      CURL: >-
        curl --silent --show-error --insecure --max-time 10
        --resolve planos.ci.test:443:127.0.0.1 --resolve planos.ci.test:80:127.0.0.1
        --resolve planos-b.ci.test:443:127.0.0.1 --resolve planos-b.ci.test:80:127.0.0.1
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      # Como no job `image`. Com `use: false` o builder padrão segue valendo para o `docker build`
      # do passo "Update, break and go back with deploy.sh", que parte de `FROM gerador-planos:ci`:
      # só o builder padrão enxerga essa imagem local (o do cache buscaria no registro).
      - name: Set up Buildx
        id: buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1
        with:
          use: false

      - name: Build the image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          builder: ${{ steps.buildx.outputs.name }}
          tags: gerador-planos:ci
          load: true
          provenance: false
          cache-from: type=gha,scope=leadkit
          cache-to: type=gha,mode=max,scope=leadkit,ignore-error=true

      - name: Start a single-node Swarm with a Traefik like the server's
        run: |
          docker swarm init --advertise-addr "$(ip -4 route get 1.1.1.1 | awk '{for (i = 1; i < NF; i++) if ($i == "src") print $(i + 1)}')"
          docker network create --driver overlay --attachable traefik-public
          # Os argumentos do Traefik do servidor (provider em modo Swarm, só o que tem
          # traefik.enable, a rede traefik-public, os entrypoints web e websecure e o redirect para
          # https), menos o Let's Encrypt: sem DNS público, o router usa o certificado padrão. A API
          # do Traefik (porta 9000) só existe aqui, para conferir o router.
          docker service create --detach=false --name traefik \
            --constraint node.role==manager --network traefik-public \
            --publish mode=host,published=80,target=80 \
            --publish mode=host,published=443,target=443 \
            --publish mode=host,published=9000,target=9000 \
            --mount type=bind,source=/var/run/docker.sock,target=/var/run/docker.sock,readonly \
            traefik:v2.11 \
            --providers.docker=true --providers.docker.swarmMode=true \
            --providers.docker.exposedbydefault=false --providers.docker.network=traefik-public \
            --entrypoints.web.address=:80 \
            --entrypoints.web.http.redirections.entrypoint.to=websecure \
            --entrypoints.web.http.redirections.entrypoint.scheme=https \
            --entrypoints.websecure.address=:443 \
            --entrypoints.traefik.address=:9000 --api.insecure=true

      - name: Start a Hatchet Lite for the worker
        run: |
          # Na rede do host: os contêineres da stack chegam nele pelo gateway do docker_gwbridge,
          # que vai no token (server_url e grpc_broadcast_address).
          gateway=$(docker network inspect docker_gwbridge --format '{{(index .IPAM.Config 0).Gateway}}')
          docker run --detach --name hatchet-db --publish 127.0.0.1:5433:5432 \
            --env POSTGRES_USER=hatchet --env POSTGRES_DB=hatchet \
            --env POSTGRES_HOST_AUTH_METHOD=trust postgres:16-trixie
          for _ in $(seq 1 30); do
            docker exec hatchet-db pg_isready -U hatchet -d hatchet >/dev/null 2>&1 && break
            sleep 1
          done
          docker run --detach --name hatchet-lite --network host \
            --env DATABASE_URL="postgresql://hatchet@127.0.0.1:5433/hatchet?sslmode=disable" \
            --env SERVER_AUTH_COOKIE_DOMAIN=localhost --env SERVER_AUTH_COOKIE_INSECURE=t \
            --env SERVER_AUTH_SET_EMAIL_VERIFIED=t \
            --env SERVER_GRPC_BIND_ADDRESS=0.0.0.0 --env SERVER_GRPC_INSECURE=t \
            --env SERVER_GRPC_PORT=7077 --env SERVER_GRPC_BROADCAST_ADDRESS="$gateway:7077" \
            --env SERVER_URL="http://$gateway:8888" \
            --env SERVER_INTERNAL_CLIENT_INTERNAL_GRPC_BROADCAST_ADDRESS=127.0.0.1:7077 \
            ghcr.io/hatchet-dev/hatchet/hatchet-lite:v0.110.5
          for _ in $(seq 1 90); do
            curl -fsS http://127.0.0.1:8733/ready >/dev/null 2>&1 && break
            sleep 2
          done
          curl -fsS http://127.0.0.1:8733/ready
          echo
          docker exec hatchet-lite ./hatchet-admin token create --config ./config \
            --tenant-id 707d0855-80ab-4e1f-a156-f1c4546cbf52 > "$RUNNER_TEMP/hatchet-token"
          test -s "$RUNNER_TEMP/hatchet-token"

      - name: Write the config folder like the server's
        run: |
          # Como ~/gerador-de-planos/swarm: stack.yaml, deploy.sh, rollout.py, app.env e
          # db.env feitos dos modelos. Escritos dentro da imagem, que tem o argon2. Os segredos são
          # sorteados a cada execução, então nada com cara de segredo entra no repositório; o hash
          # do admin entra sem aspas, como o guia pede.
          conf="$RUNNER_TEMP/swarm"
          echo "CONF=$conf" >> "$GITHUB_ENV"
          mkdir -p "$conf"
          cp deploy/swarm/stack.yaml deploy/swarm/deploy.sh deploy/swarm/rollout.py "$conf/"
          docker run --rm -i --user "$(id -u):$(id -g)" --env DOMAIN --env CI_STACK_NAME \
            -v "$PWD/deploy/swarm:/modelos:ro" -v "$conf:/conf" -v "$RUNNER_TEMP:/out" \
            gerador-planos:ci python - /modelos /conf /out <<'PY'
          import os
          import re
          import secrets
          import sys
          from pathlib import Path
          from urllib.parse import quote

          from argon2 import PasswordHasher

          domain = os.environ["DOMAIN"]
          models, configuration, out = map(Path, sys.argv[1:])
          stack = os.environ["CI_STACK_NAME"]
          database_model = (models / "db.env.example").read_text()

          def required(name):
              found = re.findall(rf"^{name}=(.+)$", database_model, flags=re.M)
              assert len(found) == 1 and found[0].strip(), name
              return found[0].strip()

          user, database = required("POSTGRES_USER"), required("POSTGRES_DB")
          admin_password = secrets.token_urlsafe(24)
          (out / "admin-password").write_text(admin_password)
          db_password = secrets.token_hex(24)


          def fill(name, values):
              text = (models / f"{name}.example").read_text()
              for key, value in values.items():
                  line = f"{key}={value}"
                  text, found = re.subn(rf"^{key}=.*$", lambda _: line, text, flags=re.M)
                  assert found == 1, key
              return text


          app_env = fill(
              "app.env",
              {
                  "STACK_NAME": stack,
                  "DATABASE_URL": (
                      f"postgresql+psycopg://{quote(user, safe='')}:{db_password}"
                      f"@{stack}_db:5432/{quote(database, safe='')}"
                  ),
                  "PUBLIC_BASE_URL": f"https://{domain}",
                  "TOKEN_SECRETS": secrets.token_urlsafe(48),
                  "OPENAI_API_KEY": "sk-ci-dummy",
                  "S3_BUCKET": "ci-bucket",
                  "HATCHET_CLIENT_TOKEN": (out / "hatchet-token").read_text().split()[-1],
                  "ADMIN_USERNAME": "ci-admin",
                  "ADMIN_PASSWORD_HASH": PasswordHasher().hash(admin_password),
                  "ADMIN_SESSION_SECRET": secrets.token_urlsafe(48),
              },
          )
          # O Hatchet Lite do CI fala gRPC sem TLS.
          (configuration / "app.env").write_text(app_env + "HATCHET_CLIENT_TLS_STRATEGY=none\n")
          (configuration / "db.env").write_text(fill("db.env", {"POSTGRES_PASSWORD": db_password}))
          PY
          # Os ensaios mantêm seus nomes internos, sem exigir esse padrão no exemplo distribuído.
          grep -qx "STACK_NAME=$CI_STACK_NAME" "$conf/app.env"
          chmod 600 "$conf/app.env" "$conf/db.env"
          ls -l "$conf"

      - name: Write the isolated continuation and release probe
        run: |
          umask 077
          cat > "$RUNNER_TEMP/continuation-probe.py" <<'PYPROBE'
          """Prova sintética na imagem imutável; somente cenário, resultado e contagens saem no log."""
          import copy
          import hashlib
          import json
          import os
          import subprocess
          import sys
          import time
          from datetime import UTC, datetime
          from pathlib import Path
          from uuid import UUID, uuid4

          sys.path.insert(0, "/app")
          PHASES = {"baseline", "blocked", "create", "return"}


          def persist(path, state):
              path.write_text(json.dumps(state, sort_keys=True, default=str))
              path.chmod(0o600)


          def business_snapshot(session):
              import sqlalchemy as sa

              result = {}
              for table in ("forms", "form_versions", "leads", "submissions", "jobs", "plans", "artifacts"):
                  rows = session.execute(sa.text(f"SELECT row_to_json(t) FROM {table} t ORDER BY id")).scalars().all()
                  # A criação das provas novas não entra no snapshot histórico da adoção.
                  result[table] = rows
              return result


          def run(phase, root):
              import app
              import sqlalchemy as sa
              from app import jobs, pipeline
              from app.deps import get_deps
              from app.forms import starter
              from app.forms.stored import import_definition
              from app.intake import SubmissionIn, accept_submission
              from app.models import Artifact, Job

              assert Path(app.__file__).resolve() == Path("/app/app/__init__.py")
              state_path = root / "state.json"
              state = json.loads(state_path.read_text()) if state_path.exists() else {}
              if phase == "baseline":
                  from cryptography.fernet import Fernet
                  state["cipher_key"] = Fernet.generate_key().decode()
              os.environ.update(APP_ENV="test", LLM_MODE="fake", PDF_MODE="fake", STORAGE_MODE="local",
                                LOCAL_STORAGE_DIR=str(root / "artifacts"), WEBHOOK_ENCRYPTION_KEY=state["cipher_key"])
              deps = get_deps()
              if phase == "baseline":
                  document = starter.definition(slug="ci-history", title="Histórico sintético")
                  document["examples"]["answers"]["email"] = "history@example.test"
                  import_definition(deps, json.dumps(document), actor="ci", contact_confirmed=True)
                  spec = deps.forms.current("ci-history")
                  with deps.sessions.begin() as session:
                      accepted = accept_submission(session, spec, SubmissionIn(answers=document["examples"]["answers"],
                          consent={"privacy": True, "text_version": spec.consent_text_version}),
                          idempotency_key="ci-history", signer=deps.signer, link_ttl=deps.link_ttl, limits=deps.submission_limits)
                      job_id, token = accepted.job.id, accepted.token
                  with deps.sessions.begin() as session:
                      jobs.claim(session, job_id, 1, "ci-synthetic")
                  plan_id, _ = pipeline.generate_plan(deps, job_id, 1)
                  artifact_id, _ = pipeline.render_pdf(deps, job_id, 1, plan_id)
                  pipeline.finalize(deps, job_id, 1, artifact_id)
                  with deps.sessions() as session:
                      from app.migrations.contracts import SIGNATURES
                      state.update(history=business_snapshot(session), history_job=str(job_id), history_token=token,
                          history_artifact=str(artifact_id), signatures={revision: hashlib.sha256(json.dumps(value, sort_keys=True).encode()).hexdigest() for revision, value in SIGNATURES.items()})
                  persist(state_path, state)
                  return
              from app.deployment_contract import DeploymentContractError, assert_contract
              from app.migrations.compatibility import validate_database
              from app.migrations.contracts import SIGNATURES
              with deps.sessions() as session:
                  assert validate_database(session.connection(), SIGNATURES) == "0020_draft_test_commands"
                  assert all(hashlib.sha256(json.dumps(SIGNATURES[revision], sort_keys=True).encode()).hexdigest() == digest for revision, digest in state["signatures"].items())
                  job = session.get_one(Job, UUID(state["history_job"]))
                  deps.signer.verify(state["history_token"], job)
                  artifact = session.get_one(Artifact, UUID(state["history_artifact"]))
                  assert hashlib.sha256(deps.storage.get(artifact.storage_key)).hexdigest() == artifact.sha256
                  # Conserve cada linha original, inclusive definição/fingerprint, assinaturas e retenção.
                  current = business_snapshot(session)
                  for table, rows in state["history"].items():
                      by_id = {str(row["id"]): row for row in current[table]}
                      assert all(by_id[str(row["id"])] == row for row in rows)
                  if phase == "blocked":
                      row = session.execute(sa.text("SELECT minimum_contract,phase,epoch,evidence,attested_at FROM deployment_contract WHERE id=1")).one()
                      assert tuple(row) == (3, "blocked", None, {}, None)
                      try:
                          assert_contract(session, required=3)
                      except DeploymentContractError:
                          return
                      raise AssertionError
                  assert_contract(session, required=3)
              import httpx
              server = subprocess.Popen([sys.executable, "-m", "uvicorn", "app.api.main:app", "--host", "127.0.0.1",
                  "--port", "18080", "--no-access-log", "--log-level", "critical"], cwd="/app",
                  stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL)
              try:
                  with httpx.Client(base_url="http://127.0.0.1:18080", timeout=20, trust_env=False) as client:
                      deadline = time.monotonic() + 60
                      while True:
